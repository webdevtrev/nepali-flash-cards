[build]
  base = "frontend"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[functions."promote-word-of-the-day"]
  # Run hourly and rely on the function to gate execution to midnight ET.
  # This avoids DST edge cases; the function will check America/New_York
  # and only run its promotion logic when the hour in that timezone is 0.
  schedule = "0 * * * *"
